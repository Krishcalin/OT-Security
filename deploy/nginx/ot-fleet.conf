# TLS terminator for an OT Sensor Fleet server (DECISIONS D8, OTS-TRN-002).
#
# The server behind this trusts two headers absolutely. Everything it knows
# about who is calling comes from them, so this file is part of the security
# design rather than deployment scaffolding around it. Two rules matter more
# than the rest:
#
#   1. A client-supplied copy of an identity header must never reach upstream.
#      `proxy_set_header` REPLACES the client's value, which is why every
#      identity header is set here — including the one this config does not
#      use, set to "" so nginx drops it rather than passing the caller's.
#
#   2. `/api/v1/enrol` and `/api/v1/ca` must work WITHOUT a client certificate.
#      A collector arriving at a substation has none; obtaining one is what it
#      is there for. So verification is `optional` at the server level and
#      enforced per location, rather than `on` globally.
#
# WHY THE CERTIFICATE AND NOT A FINGERPRINT
# -----------------------------------------
# nginx has no SHA-256 fingerprint variable. `$ssl_client_fingerprint` is SHA-1,
# and nothing in stock nginx produces the digest the server records. So this
# passes the verified certificate itself and lets the server compute the digest.
# That is the better division anyway: nginx is trusted for one thing — that the
# certificate validated against the fleet CA — rather than that plus agreeing
# about which hash to use.

upstream ot_fleet {
    server 127.0.0.1:8001;          # the uvicorn process; not exposed directly
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fleet.example;

    ssl_certificate     /etc/nginx/tls/server-cert.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # mTLS against the FLEET CA — the one this server's own /api/v1/ca
    # publishes. `optional`, not `on`: see rule 2 above.
    ssl_client_certificate /etc/nginx/tls/fleet-ca.pem;
    ssl_verify_client      optional;
    ssl_verify_depth       1;

    # A collector's inventory is not something to log the path of at info level
    # on a shared box, but a rejected certificate is worth seeing.
    access_log /var/log/nginx/ot-fleet.access.log;
    error_log  /var/log/nginx/ot-fleet.error.log warn;

    client_max_body_size 32m;       # observation batches

    # ---- the identity headers -------------------------------------------
    #
    # Set on EVERY location, including the ones that do not need an identity.
    # A header this config leaves alone is a header the caller can supply.

    # ---- the enrolment plane: no client certificate required -------------
    location = /api/v1/enrol {
        proxy_set_header X-Client-Subject     "";
        proxy_set_header X-Client-Cert        "";
        proxy_set_header X-Client-Fingerprint "";
        proxy_set_header Host                 $host;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    https;
        proxy_pass http://ot_fleet;
    }

    location = /api/v1/ca {
        proxy_set_header X-Client-Subject     "";
        proxy_set_header X-Client-Cert        "";
        proxy_set_header X-Client-Fingerprint "";
        proxy_set_header Host                 $host;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    https;
        proxy_pass http://ot_fleet;
    }

    # ---- everything else requires a verified client certificate ----------
    location / {
        if ($ssl_client_verify != SUCCESS) {
            return 403 "a verified client certificate is required (OTS-TRN-002)\n";
        }

        proxy_set_header X-Client-Subject     $ssl_client_s_dn;
        proxy_set_header X-Client-Cert        $ssl_client_escaped_cert;
        # Not used, and therefore explicitly dropped. Left unset, a caller's
        # own X-Client-Fingerprint would pass straight through to a server that
        # accepts one.
        proxy_set_header X-Client-Fingerprint "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;

        proxy_pass http://ot_fleet;
    }
}
