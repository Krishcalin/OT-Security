# TLS terminator for an OT Sensor Fleet server (DECISIONS D8, OTS-TRN-002).
#
# The nginx config beside this one carries the full reasoning; the two rules
# that decide whether this file is correct are:
#
#   1. `http-request set-header`, NEVER `add-header`. `add-header` APPENDS,
#      leaving a caller's own copy in front of HAProxy's — and a server reading
#      the first value authenticates whoever asked to be authenticated. The
#      server refuses a repeated identity header for exactly this reason, so a
#      mistake here fails loudly rather than silently; do not rely on that.
#
#   2. `/api/v1/enrol` and `/api/v1/ca` must work without a client certificate.
#      `verify optional`, enforced per path, not `verify required` globally.
#
# HAProxy CAN produce a SHA-256 natively (`ssl_c_der,sha2(256),hex`), unlike
# nginx. Either header works; the certificate is preferred when both are sent,
# because then the server depends on this file for one thing rather than two.

global
    log stdout format raw local0 info
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  120s
    timeout server  120s

frontend ot_fleet_tls
    bind :443 ssl crt /etc/haproxy/tls/server.pem \
         ca-file /etc/haproxy/tls/fleet-ca.pem verify optional

    # ---- strip anything the caller sent, unconditionally, first ----------
    #
    # Before any decision is made about them. A del-header that ran after the
    # set-header below would remove the value this terminator had just written.
    http-request del-header X-Client-Subject
    http-request del-header X-Client-Cert
    http-request del-header X-Client-Fingerprint

    # ---- the enrolment plane: no client certificate required -------------
    acl enrolment_plane path /api/v1/enrol /api/v1/ca

    # ---- everything else requires one -------------------------------------
    http-request deny deny_status 403 \
        unless enrolment_plane || { ssl_c_used 1 ssl_c_verify 0 }

    # SET, not ADD. See rule 1.
    http-request set-header X-Client-Subject %{+Q}[ssl_c_s_dn] \
        if { ssl_c_used 1 }
    http-request set-header X-Client-Fingerprint %[ssl_c_der,sha2(256),hex] \
        if { ssl_c_used 1 }

    default_backend ot_fleet

backend ot_fleet
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    server app 127.0.0.1:8001 check
