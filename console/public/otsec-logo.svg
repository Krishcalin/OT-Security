<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img"
     aria-label="OTSec">
  <title>OTSec</title>
  <!--
    INTERIM ARTWORK. This is a drawn stand-in, not the supplied logo. To ship
    the real thing see docs/brand/README.md — and read the note there about
    keeping the artwork's own field before you key anything out.
  -->
  <defs>
    <linearGradient id="ots-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ecf3"/>
      <stop offset="0.5" stop-color="#9aa7bb"/>
      <stop offset="1" stop-color="#c9d3e0"/>
    </linearGradient>
    <linearGradient id="ots-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2c"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="ots-iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.28" stop-color="#0b1020"/>
      <stop offset="0.32" stop-color="#1e6fe0"/>
      <stop offset="0.72" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0d3f8a"/>
    </radialGradient>
    <clipPath id="ots-eye">
      <path d="M120 250 C175 176 345 176 400 250 C345 324 175 324 120 250 Z"/>
    </clipPath>
  </defs>

  <!-- Pylons and feeders, the OT context the shield sits in -->
  <g stroke="#e08b3a" stroke-width="3" fill="none" opacity="0.85"
     stroke-linecap="round">
    <path d="M30 300 L48 210 L66 300 M36 268 L60 268 M40 240 L56 240"/>
    <path d="M12 214 C28 200 38 200 48 210 C58 200 68 200 84 214"/>
    <path d="M454 300 L472 210 L490 300 M460 268 L484 268 M464 240 L480 240"/>
    <path d="M436 214 C452 200 462 200 472 210 C482 200 492 200 508 214"/>
  </g>

  <!-- Shield: bevel, then face -->
  <path d="M260 20 L470 78 V276 C470 386 380 452 260 500 C140 452 50 386 50 276
           V78 Z" fill="url(#ots-bevel)"/>
  <path d="M260 44 L446 95 V276 C446 372 366 432 260 476 C154 432 74 372 74 276
           V95 Z" fill="url(#ots-face)"/>

  <!-- Circuit traces above and below the eye -->
  <g stroke="#3f7fd6" stroke-width="3" fill="none" opacity="0.9"
     stroke-linecap="round">
    <path d="M130 200 V132 M170 200 V112 M210 196 V96 M260 194 V88
             M310 196 V96 M350 200 V112 M390 200 V132"/>
    <path d="M130 300 V368 M170 300 V388 M210 304 V404 M260 306 V412
             M310 304 V404 M350 300 V388 M390 300 V368"/>
  </g>
  <g fill="#6fb2ff">
    <circle cx="130" cy="128" r="6"/><circle cx="170" cy="108" r="6"/>
    <circle cx="210" cy="92" r="6"/><circle cx="260" cy="84" r="6"/>
    <circle cx="310" cy="92" r="6"/><circle cx="350" cy="108" r="6"/>
    <circle cx="390" cy="128" r="6"/>
    <circle cx="130" cy="372" r="6"/><circle cx="170" cy="392" r="6"/>
    <circle cx="210" cy="408" r="6"/><circle cx="260" cy="416" r="6"/>
    <circle cx="310" cy="408" r="6"/><circle cx="350" cy="392" r="6"/>
    <circle cx="390" cy="372" r="6"/>
  </g>
  <g fill="#e08b3a" opacity="0.9">
    <circle cx="210" cy="356" r="5"/><circle cx="310" cy="356" r="5"/>
    <circle cx="185" cy="150" r="5"/><circle cx="335" cy="150" r="5"/>
  </g>

  <!-- The eye -->
  <path d="M120 250 C175 176 345 176 400 250 C345 324 175 324 120 250 Z"
        fill="#070b16" stroke="url(#ots-bevel)" stroke-width="9"/>
  <g clip-path="url(#ots-eye)">
    <circle cx="260" cy="250" r="66" fill="url(#ots-iris)"/>
    <g stroke="#8ec6ff" stroke-width="2.5" opacity="0.85">
      <path d="M260 190 V214 M260 286 V310 M200 250 H224 M296 250 H320
               M217 207 L234 224 M286 266 L303 283 M303 217 L286 234
               M234 276 L217 293"/>
    </g>
    <circle cx="260" cy="250" r="24" fill="#05070d"/>
  </g>

  <!-- Wordmark. "OT" takes the circuit blue, "Sec" the page ink, so the
       lockup reads as one word and still separates the domain from the job. -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif"
     font-size="78" font-weight="700" letter-spacing="1">
    <text x="260" y="546" text-anchor="middle">
      <tspan fill="#6fb2ff">OT</tspan><tspan fill="#dbe4f2">Sec</tspan>
    </text>
  </g>
</svg>
